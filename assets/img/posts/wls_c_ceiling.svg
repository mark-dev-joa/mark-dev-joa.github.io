<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <!-- Background -->
  <rect width="720" height="360" fill="#fafbfc" stroke="#e5e7eb" rx="8"/>

  <!-- Plot area: x[60-660], y[40-300] -->
  <!-- Y axis -->
  <line x1="80" y1="40" x2="80" y2="300" stroke="#374151" stroke-width="1.2"/>
  <text x="60" y="35" font-size="14" fill="#374151">ℓ(w)</text>

  <!-- X axis -->
  <line x1="80" y1="300" x2="660" y2="300" stroke="#374151" stroke-width="1.2"/>
  <text x="650" y="320" font-size="14" fill="#374151">w</text>

  <!-- C ceiling line (dashed, light coral) -->
  <line x1="80" y1="80" x2="660" y2="80" stroke="#cc785c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="84" font-size="13" fill="#cc785c" font-weight="500">C</text>
  <text x="490" y="72" font-size="12" fill="#cc785c">← 이론적 천장 (sup)</text>

  <!-- ℓ(w) curve — bell-like shape peaking at w* -->
  <path d="M 100 290 Q 200 280 280 200 Q 340 110 380 100 Q 420 110 480 200 Q 560 280 640 290"
        fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- Peak star at (380, 100) -->
  <text x="380" y="115" font-size="22" fill="#15803d" text-anchor="middle">★</text>
  <text x="430" y="105" font-size="13" fill="#15803d">실제 최댓값  ℓ(w*)</text>

  <!-- Vertical dotted line from peak to x-axis -->
  <line x1="380" y1="115" x2="380" y2="300" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- w* label on x-axis -->
  <text x="380" y="320" font-size="13" fill="#1d4ed8" text-anchor="middle">w*</text>
  <text x="380" y="340" font-size="11" fill="#6b7280" text-anchor="middle">(MLE 답)</text>

  <!-- Gap annotation between C and peak (with arrow) -->
  <line x1="200" y1="80" x2="200" y2="190" stroke="#6b7280" stroke-width="1" marker-start="url(#arrowdown)" marker-end="url(#arrowup)"/>
  <text x="105" y="135" font-size="11" fill="#6b7280">노이즈로</text>
  <text x="105" y="150" font-size="11" fill="#6b7280">인한 거리</text>
  <text x="105" y="167" font-size="10" fill="#9ca3af" font-style="italic">(불가피)</text>

  <!-- Quote near peak -->
  <text x="430" y="138" font-size="11" fill="#6b7280" font-style="italic">"최선의 fit, 그래도 노이즈 만큼 차이"</text>

  <!-- Inequality at top right -->
  <rect x="500" y="180" width="160" height="50" fill="#fff" stroke="#e5e7eb" rx="4"/>
  <text x="510" y="200" font-size="13" fill="#374151" font-family="serif">ℓ(w) ≤ C</text>
  <text x="510" y="218" font-size="11" fill="#6b7280">(등호 조건: 모든 r=0)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowdown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M2,2 L4,6 L6,2 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowup" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M2,6 L4,2 L6,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
