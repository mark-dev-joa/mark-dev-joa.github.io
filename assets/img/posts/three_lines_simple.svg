<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <rect width="500" height="500" rx="12" fill="#fafbfc" stroke="#d0d7de"/>

  <text x="250" y="32" text-anchor="middle" font-family="Arial" font-size="15" font-weight="500" fill="#24292f">
    좌표평면 위의 세 직선
  </text>

  <!-- Plot area
       Coord: w_1 from -1 to 4, w_2 from -1 to 3.5
       pixel_x = 70 + (w_1 + 1) * 75   → w_1=-1 → 70, w_1=0 → 145, w_1=1 → 220, w_1=2 → 295, w_1=3 → 370, w_1=4 → 445
       pixel_y = 410 - (w_2 + 1) * 85  → w_2=-1 → 410, w_2=0 → 325, w_2=1 → 240, w_2=2 → 155, w_2=3 → 70
  -->

  <!-- Background plot area -->
  <rect x="50" y="55" width="420" height="385" fill="#fff" stroke="#e5e7eb"/>

  <!-- Grid -->
  <g stroke="#f3f4f6" stroke-width="1">
    <line x1="70" y1="55" x2="70" y2="440"/>
    <line x1="145" y1="55" x2="145" y2="440"/>
    <line x1="220" y1="55" x2="220" y2="440"/>
    <line x1="295" y1="55" x2="295" y2="440"/>
    <line x1="370" y1="55" x2="370" y2="440"/>
    <line x1="445" y1="55" x2="445" y2="440"/>
    <line x1="50" y1="70" x2="470" y2="70"/>
    <line x1="50" y1="155" x2="470" y2="155"/>
    <line x1="50" y1="240" x2="470" y2="240"/>
    <line x1="50" y1="410" x2="470" y2="410"/>
  </g>

  <!-- Axes -->
  <line x1="50" y1="325" x2="475" y2="325" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="145" y1="445" x2="145" y2="50" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="475" y="340" font-family="Arial" font-size="13" font-weight="500" fill="#6b7280">w₁</text>
  <text x="125" y="55" font-family="Arial" font-size="13" font-weight="500" fill="#6b7280">w₂</text>

  <!-- Tick labels -->
  <g font-family="Arial" font-size="11" font-weight="400" fill="#9ca3af">
    <text x="70" y="343" text-anchor="middle">−1</text>
    <text x="145" y="343" text-anchor="middle">0</text>
    <text x="220" y="343" text-anchor="middle">1</text>
    <text x="295" y="343" text-anchor="middle">2</text>
    <text x="370" y="343" text-anchor="middle">3</text>
    <text x="445" y="343" text-anchor="middle">4</text>
    <text x="138" y="411" text-anchor="end">−1</text>
    <text x="138" y="244" text-anchor="end">1</text>
    <text x="138" y="159" text-anchor="end">2</text>
    <text x="138" y="74" text-anchor="end">3</text>
  </g>

  <!-- L_1: w_1 + w_2 = 2 → w_2 = 2 - w_1
       w_1 = -1 → w_2 = 3 → x=70, y=70
       w_1 = 4 → w_2 = -2 → off; clip at w_2 = -1 → w_1 = 3 → x=370, y=410
  -->
  <line x1="70" y1="70" x2="370" y2="410" stroke="#dc2626" stroke-width="2.8"/>
  <!-- Label near upper-left of L_1 -->
  <rect x="78" y="78" width="120" height="22" fill="#fef2f2" stroke="#dc2626" stroke-width="1" rx="3"/>
  <text x="138" y="93" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#dc2626">L₁: w₁ + w₂ = 2</text>

  <!-- L_2: w_1 + 2w_2 = 3 → w_2 = (3 - w_1)/2
       w_1 = -1 → w_2 = 2 → x=70, y=155
       w_1 = 4 → w_2 = -0.5 → x=445, y=367.5
  -->
  <line x1="70" y1="155" x2="445" y2="367" stroke="#f59e0b" stroke-width="2.8"/>
  <rect x="320" y="180" width="130" height="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="3"/>
  <text x="385" y="195" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#b45309">L₂: w₁ + 2w₂ = 3</text>

  <!-- L_3: w_1 + 3w_2 = 5 → w_2 = (5 - w_1)/3
       w_1 = -1 → w_2 = 2 → x=70, y=155
       w_1 = 4 → w_2 = 1/3 ≈ 0.333 → x=445, y=297
  -->
  <line x1="70" y1="155" x2="445" y2="297" stroke="#16a34a" stroke-width="2.8"/>
  <rect x="220" y="262" width="130" height="22" fill="#d1fae5" stroke="#16a34a" stroke-width="1" rx="3"/>
  <text x="285" y="277" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#15803d">L₃: w₁ + 3w₂ = 5</text>

  <defs>
    <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
